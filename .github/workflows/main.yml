name: Torrent Download & Upload to Filemirage

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '9'
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'
      FOLDER_PATH: 'downloaded_files'
      ZIP_NAME: 'downloaded_files.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install qbittorrent-nox jq curl zip -y
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with qBittorrent
        run: |
          mkdir -p "$FOLDER_PATH"
          
          # Pre-configure qBittorrent to bypass legal terms and localhost authentication
          mkdir -p ~/.config/qBittorrent
          cat << 'EOF' > ~/.config/qBittorrent/qBittorrent.conf
          [LegalNotice]
          Accepted=true

          [Preferences]
          WebUI\Port=8080
          WebUI\LocalHostAuth=false
          WebUI\AuthSubnetWhitelist=127.0.0.1/32
          WebUI\AuthSubnetWhitelistEnabled=true
          EOF

          # Start qbittorrent daemon in background
          qbittorrent-nox -d
          sleep 5

          # Add magnet links via Web API
          while IFS= read -r link || [ -n "$link" ]; do
            link=$(echo "$link" | tr -d '\r')
            if [ -n "$link" ] && [[ ! "$link" =~ ^# ]]; then
              echo "Adding to qBittorrent: $link"
              curl -s -X POST \
                -F "urls=$link" \
                -F "savepath=$PWD/$FOLDER_PATH" \
                http://127.0.0.1:8080/api/v2/torrents/add
            fi
          done < page.txt

          echo "Waiting for all torrents to finish downloading..."
          
          # Monitoring loop via Web API
          while true; do
            sleep 10
            
            RESPONSE=$(curl -s http://127.0.0.1:8080/api/v2/torrents/info)
            
            TOTAL=$(echo "$RESPONSE" | jq '. | length' 2>/dev/null || echo "0")
            INCOMPLETE=$(echo "$RESPONSE" | jq '[.[] | select(.progress < 1)] | length' 2>/dev/null || echo "0")
            
            if [ "$TOTAL" -eq 0 ]; then
              echo "No active torrents found."
              break
            fi

            # Calculate average progress across all torrents
            OVERALL_PCT=$(echo "$RESPONSE" | jq '[.[].progress] | (add / length * 100 | round)')

            echo "----------------------------------------------------------------------"
            echo "--> Active Torrents: $TOTAL | Incomplete: $INCOMPLETE | Overall Progress: ${OVERALL_PCT}%"
            echo "----------------------------------------------------------------------"

            # Print individual torrent status, % complete, speed, and state
            echo "$RESPONSE" | jq -r '.[] | "[\((.progress * 100 | round))%] \(.name) | \((.dlspeed / 1024 / 1024 * 100 | round) / 100) MB/s | \(.state)"'

            if [ "$INCOMPLETE" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "----------------------------------------------------------------------"
              echo "All downloads completed!"
              break
            fi
          done

          # Stop qbittorrent daemon
          pkill qbittorrent-nox || true
          sleep 2

      - name: Zip downloaded files
        run: |
          echo "Compressing $FOLDER_PATH into $ZIP_NAME..."
          zip -r "$ZIP_NAME" "$FOLDER_PATH"

      
