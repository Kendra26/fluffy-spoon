name: Torrent Download & Upload to Filemirage

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      PIXELDRAIN_API_KEY: '9'
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'
      FOLDER_PATH: 'downloaded_files'
      ZIP_NAME: 'downloaded_files.zip'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y jq curl zip python3 python3-libtorrent
          curl -o page.txt "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"

      - name: Download torrent content with libtorrent
        run: |
          mkdir -p "$FOLDER_PATH"

          cat << 'EOF' > download.py
          import sys
          import time
          import libtorrent as lt

          save_path = sys.argv[1]
          ses = lt.session({'listen_interfaces': '0.0.0.0:6881'})

          with open("page.txt", "r") as f:
              links = [line.strip() for line in f if line.strip() and not line.startswith('#')]

          for link in links:
              print(f"Processing magnet link...")
              params = lt.parse_magnet_uri(link)
              params.save_path = save_path
              handle = ses.add_torrent(params)

              print("Resolving magnet metadata...")
              while not handle.has_metadata():
                  time.sleep(1)

              tor_info = handle.torrent_file()
              print(f"Downloading: {tor_info.name()}")

              while handle.status().progress < 1.0:
                  s = handle.status()
                  print(f"Progress: {s.progress * 100:.1f}% | Speed: {s.download_rate / 1024:.1f} kB/s | Peers: {s.num_peers}")
                  time.sleep(3)
                  
              print(f"Finished: {tor_info.name()}")
          EOF

          python3 download.py "$FOLDER_PATH"

      - name: Zip downloaded files
        run: |
          echo "Compressing $FOLDER_PATH into $ZIP_NAME..."
          zip -r "$ZIP_NAME" "$FOLDER_PATH"

      - name: Upload zip file to Filemirage
        run: |
          SERVER=$(curl -s https://filemirage.com/api/servers | jq -r '.data.server')
          UPLOAD_ID=$(curl -s https://filemirage.com/api/servers | jq -r '.data.upload_id')
          
          echo "Using server: $SERVER"
          echo "Upload ID: $UPLOAD_ID"
          echo "Uploading: $ZIP_NAME"
          
          RESPONSE=$(curl -s -H "Authorization: Bearer $FILEMIRAGE_API_TOKEN" \
            -F "file=@$ZIP_NAME;filename=$ZIP_NAME" \
            "$SERVER/upload.php")
          
          success=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$success" != "true" ]; then
              echo "Failed to upload $ZIP_NAME: $(echo "$RESPONSE" | jq -r '.message')"
              exit 1
          else
              echo "Successfully uploaded: $ZIP_NAME"
          fi
