name: Direct Torrent Download & Filemirage Upload

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  torrent-upload:
    runs-on: ubuntu-latest
    env:
      FILEMIRAGE_API_TOKEN: '9QQH-DGES-CWQZ-FXNV'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y python3 python3-libtorrent python3-requests

      - name: Process Torrents & Upload to Filemirage
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import time
          import tempfile
          import urllib.request
          import requests
          import libtorrent as lt

          PAGE_URL = "https://equestria-eta.vercel.app/api/pages/dprjjMvC8fCF/raw"
          FILEMIRAGE_TOKEN = os.environ.get("FILEMIRAGE_API_TOKEN", "")

          def main():
              # 1. Create temporary directory
              temp_dir = tempfile.mkdtemp(prefix="torrent_download_")
              print(f"Saving downloads to temporary folder: {temp_dir}")

              # 2. Fetch magnet links from raw endpoint
              print("Fetching magnet links...")
              req = urllib.request.Request(PAGE_URL, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req) as response:
                      lines = response.read().decode("utf-8").splitlines()
              except Exception as e:
                  print(f"Failed to fetch page: {e}")
                  sys.exit(1)

              links = [line.strip() for line in lines if line.strip() and not line.startswith("#")]

              if not links:
                  print("No magnet links found.")
                  return

              # 3. Add all links to session for SIMULTANEOUS downloads
              ses = lt.session({"listen_interfaces": "0.0.0.0:6881"})
              handles = []

              print(f"Adding {len(links)} magnet link(s) to download concurrently...")
              for link in links:
                  params = lt.parse_magnet_uri(link)
                  params.save_path = temp_dir
                  handle = ses.add_torrent(params)
                  handles.append(handle)

              # 4. Resolve metadata for all torrents
              print("Resolving metadata...")
              for handle in handles:
                  while not handle.status().has_metadata:
                      time.sleep(1)
                  print(f"Metadata acquired for: {handle.torrent_file().name()}")

              # 5. Parallel download execution loop
              print("\nDownloading simultaneously...")
              while True:
                  all_done = True
                  reports = []

                  for i, handle in enumerate(handles):
                      s = handle.status()
                      if s.progress < 1.0:
                          all_done = False
                      reports.append(
                          f"T{i+1}: {s.progress * 100:.1f}% ({s.download_rate / 1024:.1f} kB/s)"
                      )

                  print(" | ".join(reports), end="\r")

                  if all_done:
                      break
                  time.sleep(3)

              print("\n\nAll torrent downloads completed!")

              # 6. Query Filemirage upload server
              print("Querying Filemirage API server endpoint...")
              try:
                  srv_resp = requests.get("https://filemirage.com/api/servers").json()
                  server = srv_resp.get("data", {}).get("server")
              except Exception as e:
                  print(f"Error reaching Filemirage API: {e}")
                  sys.exit(1)

              if not server:
                  print("Failed to obtain server address from Filemirage.")
                  sys.exit(1)

              headers = {"Authorization": f"Bearer {FILEMIRAGE_TOKEN}"}

              # 7. Upload individual unzipped files directly from temp folder
              print(f"\nUploading extracted files from {temp_dir} to Filemirage...")
              has_failed = False
              for root, _, files in os.walk(temp_dir):
                  for file in files:
                      file_path = os.path.join(root, file)
                      print(f"Uploading: {file_path}")

                      with open(file_path, "rb") as f:
                          res = requests.post(
                              f"{server.rstrip('/')}/upload.php",
                              headers=headers,
                              files={"file": (file, f)},
                          )

                      if res.status_code == 200 and res.json().get("success"):
                          print(f" -> Uploaded successfully: {file}")
                      else:
                          print(f" -> Upload failed for {file}: {res.text}")
                          has_failed = True

              if has_failed:
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF
