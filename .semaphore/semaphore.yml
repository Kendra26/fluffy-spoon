version: v1.0

name: Download Torrent and Upload to BuzzHeavy

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004

blocks:
  - name: Download & Upload
    task:
      jobs:
        - name: Download and Upload Files
          commands:
            - checkout
            - echo "📦 Installing webtorrent-cli..."
            - sudo apt update
            - sudo apt install -y aria2
            - echo "📥 Downloading torrent..."
            - mkdir -p downloads
            - curl -s https://klipit.in/ugq73679 | grep -oP 'magnet:\S+|https?://\S+\.(mp4|mkv|avi|srt|itorrents)' > download_links.txt
            - aria2c --seed-time=0 --dir=downloads -i download_links.txt
            
            - echo "📤 Uploading files to BuzzHeavy..."
            - |
               LOCAL_DIR="downloads"
               TARGET_URL="https://w.buzzheavier.com/bnyznwosiir7"
               ACCOUNT_ID="HZ7U0SXV0YKJYO0C77ZI"  # Replace with your actual account ID
               
               find "$LOCAL_DIR" -type f | while read -r FILE; do
                   FILENAME=$(basename "$FILE")
                   curl -#o - -T "$FILE" \
                     -H "Authorization: Bearer $ACCOUNT_ID" \
                     "$TARGET_URL/$FILENAME"
               done
